services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    ports:
      - "5434:5432"       # host:container — postgres always listens on 5432 inside
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"       # host:container — postgres always listens on 5432 inside
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: "postgresql://auth_user:auth_pass@auth-db:5432/auth_db?schema=public"
      JWT_ACCESS_SECRET: "access-secret-change-in-production-min-32-chars"
      JWT_REFRESH_SECRET: "refresh-secret-change-in-production-min-32-chars"
    volumes:
      - ./auth-service/src:/app/src
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: "postgresql://user_user:user_pass@user-db:5432/user_db?schema=public"
      JWT_ACCESS_SECRET: "access-secret-change-in-production-min-32-chars"
    volumes:
      - ./user-service/src:/app/src
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_ACCESS_SECRET: "access-secret-change-in-production-min-32-chars"
      AUTH_SERVICE_URL: "http://auth-service:3001"
      USER_SERVICE_URL: "http://user-service:3002"
    volumes:
      - ./api-gateway/src:/app/src
    depends_on:
      - auth-service
      - user-service
    restart: unless-stopped

volumes:
  auth-db-data:
  user-db-data:
